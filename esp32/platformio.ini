; AIRSTEP -> ESP32-H2 -> HX Stomp MIDI bridge
;
; The official platformio/espressif32 platform cannot build this: every release
; up to 7.x still ships Arduino core 2.0.17 / IDF 4.4, and it has no board
; definition for the ESP32-H2 at all. ESP32-H2 support landed in arduino-esp32
; 3.0.0, which only the pioarduino fork packages for PlatformIO.
;
; NimBLE-Arduino must be >= 2.3.8. The H2 Arduino core enables NimBLE itself
; (Bluedroid is not built for H2), and versions below 2.3.8 crash on init or
; leak memory in exactly that configuration. 2.5.1 additionally fixes builds
; against Arduino 3.3.11, which is what the pioarduino stable channel ships.

[env:esp32-h2-devkitm-1]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-h2-devkitm-1
framework = arduino

lib_deps =
    h2zero/NimBLE-Arduino@^2.5.1

; The console goes over the board's native USB-Serial/JTAG port (the one marked
; "ESP32-H2 USB", VID 303A / PID 1001), because that is the port this is
; developed against -- it flashes and monitors over one cable. Without these two
; flags `Serial` would be UART0 on GPIO24/23 and therefore only reachable from
; the *other* USB port, the USB-UART bridge, and the monitor would sit silent.
;
; The H2 has no TinyUSB, only hardware CDC, so USB_MODE must be 1. Both flags are
; set explicitly rather than relying on the platform to inject them: `#if
; ARDUINO_USB_MODE` evaluates to 0 when undefined, which would select a
; `USBSerial` object that does not exist on this chip.
;
; If you would rather use the UART bridge port, delete both flags. MIDI is on
; UART1 either way, so it never collides with the console.
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
